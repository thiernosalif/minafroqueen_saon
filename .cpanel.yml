---
deployment:
  tasks:
    # ADAPTEZ ce chemin : dossier racine de votre domaine sur o2switch (ex. /home/mbth3911/public_html ou /home/mbth3911/monsite.com)
    - export DEPLOYPATH=/home/mbth3911/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R index.php install.php .htaccess app assets $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/uploads $DEPLOYPATH/storage
    - /bin/cp uploads/.htaccess $DEPLOYPATH/uploads/.htaccess
    - /bin/cp storage/.htaccess $DEPLOYPATH/storage/.htaccess
